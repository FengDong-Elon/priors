[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priors-quant"
version = "0.0.1"
description = "A literature-first AI research assistant for systematic investing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pydantic>=2.5",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "anthropic>=0.121",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "markdown>=3.5",
    "xhtml2pdf>=0.2.15",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.40"]
proxy = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
priors = "priors.cli:main"

[tool.setuptools.package-data]
priors = ["literature/core_library/*.csv", "reports/*.j2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
